<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background rounded squircle with subtle obsidian radial depth -->
    <radialGradient id="bgObsidian" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="60%" stop-color="#070a10" />
      <stop offset="100%" stop-color="#040608" />
    </radialGradient>

    <!-- Wing 1: Luminous Emerald Gradient -->
    <linearGradient id="emeraldWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Wing 2: Electric Cyan Gradient -->
    <linearGradient id="cyanWing" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Wing 3: Deep Obsidian Kinetic Facet -->
    <linearGradient id="obsidianFacet" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Specular Rim Gradient -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="50%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Core Plasma Singularity -->
    <radialGradient id="corePlasma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#67e8f9" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <!-- High-Tech Neon Glow Filter -->
    <filter id="hyperGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#10b981" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.55"/>
    </filter>

    <!-- Ambient Backlight -->
    <filter id="ambientBackdrop" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36" />
    </filter>
  </defs>

  <!-- Container App Icon Tile (Modern Windows 11 Fluent Squircle) -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgObsidian)" stroke="#172235" stroke-width="3"/>

  <!-- Ambient Internal Aura -->
  <circle cx="256" cy="256" r="140" fill="#06b6d4" opacity="0.12" filter="url(#ambientBackdrop)"/>
  <circle cx="256" cy="256" r="100" fill="#10b981" opacity="0.14" filter="url(#ambientBackdrop)"/>

  <!-- Main Vortex Hyper-Core Geometric Group -->
  <g filter="url(#hyperGlow)">
    <!-- BLADE 1 (Upper-Left Hypersonic Emerald Wing) -->
    <path d="M 256,92 
             C 290,140 335,190 396,218 
             L 326,242 
             C 284,222 250,188 232,154 
             Z" 
          fill="url(#emeraldWing)" />

    <!-- BLADE 2 (Right Supersonic Electric Cyan Wing) -->
    <path d="M 420,256 
             C 370,290 320,335 292,396 
             L 270,326 
             C 290,284 324,250 358,232 
             Z" 
          fill="url(#cyanWing)" />

    <!-- BLADE 3 (Lower-Left Kinetic Obsidian Flow Wing) -->
    <path d="M 256,420 
             C 222,370 177,320 116,292 
             L 186,270 
             C 228,290 262,324 280,358 
             Z" 
          fill="url(#obsidianFacet)" stroke="#1e293b" stroke-width="1.5" />

    <!-- BLADE 4 (Top-Left Inverted Acceleration Shard) -->
    <path d="M 92,256 
             C 142,222 192,177 220,116 
             L 242,186 
             C 222,228 188,262 154,280 
             Z" 
          fill="url(#emeraldWing)" opacity="0.9" />

    <!-- CENTRAL CONVERGENCE CHOPPER: 3-Bladed Aerodynamic Vortex Rotor -->
    <!-- Rotor Blade A (Emerald-Cyan Transition) -->
    <polygon points="256,256 220,180 275,150 256,220" fill="url(#specularRim)" />
    <!-- Rotor Blade B (Cyan-Blue Transition) -->
    <polygon points="256,256 332,220 362,275 292,256" fill="url(#cyanWing)" />
    <!-- Rotor Blade C (Emerald-Obsidian Transition) -->
    <polygon points="256,256 256,335 200,340 230,278" fill="url(#emeraldWing)" />
    <!-- Rotor Blade D (Kinetic Carbon Counter-Balance) -->
    <polygon points="256,256 180,292 150,237 220,256" fill="url(#obsidianFacet)" />

    <!-- INNER VORTEX ACCELERATION RING (Concentric Orbital Guide) -->
    <circle cx="256" cy="256" r="64" fill="none" stroke="url(#specularRim)" stroke-width="3.5" stroke-dasharray="88 18 44 14" opacity="0.9" />
    <circle cx="256" cy="256" r="42" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="30 15 20 10" opacity="0.75" />

    <!-- FOCAL CORE PLASMA SINGULARITY (Center Glow) -->
    <circle cx="256" cy="256" r="28" fill="url(#corePlasma)" />
    <circle cx="256" cy="256" r="9" fill="#ffffff" />
    
    <!-- Precision Bevel Specular Highlights -->
    <line x1="256" y1="92" x2="256" y2="220" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <line x1="420" y1="256" x2="292" y2="256" stroke="#67e8f9" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>

